<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Podskrift mobile menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.pk{--paper:#FFFFFF;--surface:#F4F6F5;--line:#DCE2DF;--line-strong:#0E1512;--ink:#0E1512;--muted:#56635D;--accent:#0A7A55;--accent-hover:#075C40;--on-accent:#FFFFFF}
.pk[data-theme="dark"]{--paper:#0A0F0D;--surface:#121916;--line:#24302B;--line-strong:#5C6F66;--ink:#EEF2F0;--muted:#9AA8A1;--accent:#34D399;--accent-hover:#6EE7B7;--on-accent:#06241A}
.pk a{color:var(--ink)}.pk a:hover{color:var(--accent)}
.pk a.primary{color:var(--on-accent)}.pk a.primary:hover{color:var(--on-accent);background:var(--accent-hover)}
.pk input::placeholder{color:var(--muted)}
.pk :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="pk" data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 17px; line-height: 1.55">

<header style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-bottom: 1px solid var(--line)">
<a href="Forside.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; font-size: 22px; font-weight: 800; letter-spacing: -0.035em"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><g fill="var(--ink)"><rect x="2" y="9" width="3" height="10" rx="1.5"/><rect x="8" y="4" width="3" height="20" rx="1.5"/><rect x="14" y="8" width="3" height="12" rx="1.5"/></g><g fill="var(--accent)"><rect x="20" y="7" width="8" height="3" rx="1.5"/><rect x="20" y="12.5" width="8" height="3" rx="1.5"/><rect x="20" y="18" width="5" height="3" rx="1.5"/></g></svg>podskrift</a>
<button type="button" aria-expanded="{{expanded}}" aria-controls="m-menu" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 8px">
<sc-if value="{{closed}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h9"/></svg></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></sc-if>
{{toggleLabel}}</button>
</header>

<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<nav id="m-menu" aria-label="Main" style="flex-grow: 1; display: flex; flex-direction: column; padding: 8px 16px 24px">
<a href="Forside.dc.html" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Transcribe</a>
<a href="#" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Pricing</a>
<a href="#" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Questions</a>
<a href="#" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Find an RSS feed</a>
<a href="#" style="display: flex; align-items: center; min-height: 60px; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">API</a>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a class="primary" href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; font-size: 17px; font-weight: 700; background: var(--accent); text-decoration: none; border-radius: 8px">Sign up</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; font-size: 17px; font-weight: 700; border: 1px solid var(--line-strong); text-decoration: none; border-radius: 8px">Log in</a>
<div style="text-align: center; font-size: 14px; color: var(--muted)">First 60 minutes free.</div>
</div>
</nav>
</sc-if>

<sc-if value="{{closed}}" hint-placeholder-val="{{false}}">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 40px 16px">
<h1 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02">Transcribe any podcast in minutes</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: var(--muted)">Search for a podcast, pick an episode, get the full transcript. First 60 minutes free.</p>
<input type="text" aria-label="Search" placeholder="Search by name, or paste a link" style="height: 56px; box-sizing: border-box; padding: 0 16px; font-family: inherit; font-size: 17px; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 8px">
<a class="primary" href="Episoder.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; font-size: 17px; font-weight: 700; background: var(--accent); text-decoration: none; border-radius: 8px">Search</a>
</main>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: true };
}
renderVals() {
const open = this.state.open;
return {
theme: this.props.dark ? 'dark' : 'light',
open: open,
closed: !open,
expanded: open ? 'true' : 'false',
toggleLabel: open ? 'Close' : 'Menu',
toggle: () => this.setState({ open: !this.state.open })
};
}
}
</script>
</body>
</html>
