<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Podskrift choose an episode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.pk{--paper:#FFFFFF;--surface:#F4F6F5;--line:#DCE2DF;--line-strong:#0E1512;--ink:#0E1512;--muted:#56635D;--accent:#0A7A55;--accent-hover:#075C40;--on-accent:#FFFFFF;--accent-tint:#E3F3EC;--on-accent-tint:#064E36}
.pk[data-theme="dark"]{--paper:#0A0F0D;--surface:#121916;--line:#24302B;--line-strong:#5C6F66;--ink:#EEF2F0;--muted:#9AA8A1;--accent:#34D399;--accent-hover:#6EE7B7;--on-accent:#06241A;--accent-tint:#0F2A20;--on-accent-tint:#A7F3D0}
.pk a{color:var(--accent)}.pk a:hover{color:var(--accent-hover)}
.pk a.primary{color:var(--on-accent)}.pk a.primary:hover{color:var(--on-accent);background:var(--accent-hover)}
.pk a.plain{color:var(--ink)}.pk a.plain:hover{color:var(--accent)}
.pk a.tinted{color:var(--on-accent-tint)}
.pk :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="pk" data-theme="{{theme}}" style="min-height: 100vh; background: var(--paper); color: var(--ink); font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 17px; line-height: 1.55">

<header style="border-bottom: 1px solid var(--line)">
<nav aria-label="Main" style="max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px">
<a class="plain" href="Forside.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; font-size: 22px; font-weight: 800; letter-spacing: -0.035em"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><g fill="var(--ink)"><rect x="2" y="9" width="3" height="10" rx="1.5"/><rect x="8" y="4" width="3" height="20" rx="1.5"/><rect x="14" y="8" width="3" height="12" rx="1.5"/></g><g fill="var(--accent)"><rect x="20" y="7" width="8" height="3" rx="1.5"/><rect x="20" y="12.5" width="8" height="3" rx="1.5"/><rect x="20" y="18" width="5" height="3" rx="1.5"/></g></svg>podskrift</a>
<div style="flex-grow: 1"></div>
<a class="plain" href="#" style="display: flex; align-items: center; min-height: 44px; text-decoration: none; font-size: 15px; font-weight: 500">Feeds</a>
<a class="plain" href="#" style="display: flex; align-items: center; min-height: 44px; text-decoration: none; font-size: 15px; font-weight: 500">History</a>
<a class="plain" href="#" style="display: flex; align-items: center; min-height: 44px; text-decoration: none; font-size: 15px; font-weight: 500">Settings</a>
</nav>
</header>

<main style="max-width: 880px; margin: 0 auto; padding: 32px 24px 96px; display: flex; flex-direction: column; gap: 28px">
<a href="Forside.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; align-self: flex-start; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"/></svg>New search</a>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
<div style="flex: none; width: 96px; height: 96px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted)">cover art</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05">The Long Listen</h1>
<div style="font-size: 16px; color: var(--muted)">Example Studio</div>
</div>
<button type="button" style="height: 44px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 8px">Save feed</button>
</div>

<div style="padding: 14px 16px; border-radius: 8px; background: var(--accent-tint); color: var(--on-accent-tint); font-size: 15px; line-height: 1.45">Free trial: 60 minutes of audio left, on our key. <a class="tinted" href="#" style="font-weight: 700">Add your own key</a> for unlimited use.</div>

<div style="display: flex; flex-direction: column; gap: 6px; max-width: 320px">
<label for="ep-lang" style="font-size: 14px; font-weight: 700">Spoken language</label>
<select id="ep-lang" style="height: 48px; padding: 0 12px; font-family: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 8px"><option>Auto-detect</option><option>English</option><option>Norwegian</option><option>Spanish</option></select>
<div style="font-size: 14px; color: var(--muted)">Name the language if auto-detect gets it wrong.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2">Episodes</h2>
<div style="display: flex; flex-direction: column; border-bottom: 1px solid var(--line)">
<sc-for list="{{episodes}}" as="ep" hint-placeholder-count="5">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 16px 0; border-top: 1px solid var(--line)">
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 17px; font-weight: 700">{{ep.title}}</div><div style="font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums">{{ep.meta}}</div></div>
<sc-if value="{{ep.done}}" hint-placeholder-val="{{false}}"><a href="Transkripsjon.dc.html" style="display: flex; align-items: center; height: 44px; font-size: 15px; font-weight: 700">View transcript</a></sc-if>
<sc-if value="{{ep.todo}}" hint-placeholder-val="{{true}}"><a class="primary" href="Transkripsjon.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; font-size: 15px; font-weight: 700; background: var(--accent); text-decoration: none; border-radius: 8px">Transcribe</a></sc-if>
</div>
</sc-for>
</div>
<button type="button" style="align-self: flex-start; margin-top: 12px; height: 44px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 8px">Show older episodes</button>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
['Why we still take notes', '2 Oct 2026 · 48 min', false],
['The case for slow interviews', '25 Sep 2026 · 1 h 12 min', true],
['What editors cut first', '18 Sep 2026 · 37 min', false],
['Listening at double speed', '11 Sep 2026 · 52 min', false],
['A short history of the show notes', '4 Sep 2026 · 44 min', false],
['Questions from listeners', '28 Aug 2026 · 1 h 3 min', false]
];
return {
theme: this.props.dark ? 'dark' : 'light',
episodes: rows.map((r) => ({ title: r[0], meta: r[1], done: r[2], todo: !r[2] }))
};
}
}
</script>
</body>
</html>
