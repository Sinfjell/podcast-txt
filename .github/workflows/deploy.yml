name: Deploy production

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore ffmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ffmpeg
          key: ffmpeg-${{ runner.os }}-btbn-n8.1-v1

      - name: Install ffmpeg
        id: install-ffmpeg
        timeout-minutes: 8
        run: |
          set -euo pipefail
          FFMPEG_DIR="$HOME/.ffmpeg"
          STATIC_OK=0

          if [[ -x "$FFMPEG_DIR/ffmpeg" && -x "$FFMPEG_DIR/ffprobe" ]]; then
            echo "Restored static ffmpeg from cache"
            STATIC_OK=1
          else
            echo "Cache miss; downloading BtbN static ffmpeg"
            mkdir -p "$FFMPEG_DIR"
            URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
            TMP_TAR="$(mktemp /tmp/ffmpeg-XXXXXX.tar.xz)"
            TMP_DIR="$(mktemp -d /tmp/ffmpeg-extract-XXXXXX)"
            if curl -fsSL --retry 3 -o "$TMP_TAR" "$URL" \
              && tar -xJf "$TMP_TAR" -C "$TMP_DIR" \
              && install -m 755 "$TMP_DIR"/ffmpeg-*/bin/ffmpeg "$FFMPEG_DIR/ffmpeg" \
              && install -m 755 "$TMP_DIR"/ffmpeg-*/bin/ffprobe "$FFMPEG_DIR/ffprobe"; then
              echo "Downloaded static ffmpeg"
              STATIC_OK=1
              echo "static-downloaded=true" >> "$GITHUB_OUTPUT"
            else
              echo "Static download failed; falling back to apt"
              rm -rf "$FFMPEG_DIR"
              sudo apt-get update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
            fi
            rm -rf "$TMP_TAR" "$TMP_DIR"
          fi

          if [[ "$STATIC_OK" -eq 1 ]]; then
            echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
            export PATH="$FFMPEG_DIR:$PATH"
          fi

          ffmpeg -version | head -n1

      - name: Save ffmpeg cache
        if: steps.install-ffmpeg.outputs.static-downloaded == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ffmpeg
          key: ffmpeg-${{ runner.os }}-btbn-n8.1-v1

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest test_app.py test_admin_costs.py -q

  deploy:
    name: Deploy to Hetzner
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Drain can wait up to 20 minutes for in-flight transcriptions before restart.
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          PODSKRIFT_SSH_KEY: ${{ secrets.PODSKRIFT_SSH_KEY }}
          PODSKRIFT_SSH_KNOWN_HOSTS: ${{ secrets.PODSKRIFT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${PODSKRIFT_SSH_KEY:-}" || { echo "Missing secret PODSKRIFT_SSH_KEY"; exit 1; }
          test -n "${PODSKRIFT_SSH_KNOWN_HOSTS:-}" || { echo "Missing secret PODSKRIFT_SSH_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Preserve newlines in the private key (ed25519 / RSA PEM).
          printf '%s\n' "$PODSKRIFT_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$PODSKRIFT_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull main, drain in-flight jobs, restart podskrift
        env:
          PODSKRIFT_SSH_HOST: ${{ secrets.PODSKRIFT_SSH_HOST }}
          PODSKRIFT_SSH_USER: ${{ secrets.PODSKRIFT_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${PODSKRIFT_SSH_HOST:-}" || { echo "Missing secret PODSKRIFT_SSH_HOST"; exit 1; }
          test -n "${PODSKRIFT_SSH_USER:-}" || { echo "Missing secret PODSKRIFT_SSH_USER"; exit 1; }
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "${PODSKRIFT_SSH_USER}@${PODSKRIFT_SSH_HOST}" \
              'set -euo pipefail
               cd /var/www/vhosts/podskrift.nettsmed.dev/app
               git fetch origin
               git checkout main
               # Drain BEFORE pulling: the old process keeps serving during the
               # wait (up to 20 min) and must not lazily load new templates or
               # modules from a half-updated tree. Script comes from the new
               # commit without touching the working tree. Anything still
               # running after the wait is re-queued on boot resume.
               git show origin/main:ops/drain-in-flight.sh \
                 | PODSKRIFT_DRAIN_MAX_WAIT_SEC=1200 bash -s
               git pull --ff-only origin main
               systemctl restart podskrift
               systemctl is-active --quiet podskrift
               echo "podskrift is active"
               echo "HEAD $(git rev-parse --short HEAD)"
              '
