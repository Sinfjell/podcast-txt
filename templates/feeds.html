{% extends "base.html" %}
{% block title %}My Feeds — Podskrift{% endblock %}

{% block content %}
<h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 24px;">My Feeds</h2>

<div class="card">
    <div class="card-header">
        <h5>Add Feed</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('add_feed') }}" style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input type="text" class="form-input" name="name" placeholder="Name" required style="flex: 1; min-width: 120px;">
            <input type="url" class="form-input" name="rss_url" placeholder="RSS feed URL" required style="flex: 2; min-width: 200px;">
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h5>Saved Feeds</h5>
        <span class="badge">{{ feeds|length }}</span>
    </div>
    {% if feeds %}
        {% for feed in feeds %}
        <div class="list-item">
            <div class="list-item-text">
                <div class="list-item-title">{{ feed.name }}</div>
                <div class="list-item-sub">{{ feed.rss_url }}</div>
            </div>
            <div class="list-item-actions">
                <a href="{{ url_for('use_feed', feed_id=feed.id) }}" class="btn btn-sm btn-accent">Use</a>
                <form method="POST" action="{{ url_for('delete_feed', feed_id=feed.id) }}" style="display: inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Remove this feed?')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="card-body text-center text-muted">
            No saved feeds yet.
        </div>
    {% endif %}
</div>
{% endblock %}
