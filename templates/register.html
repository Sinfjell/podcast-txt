{% extends "base.html" %}
{% block title %}Sign Up — Podskrift{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 24px;">Create account</h2>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-input" id="email" name="email" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-input" id="password" name="password" required minlength="8">
                    <p class="form-hint">Minimum 8 characters</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password2">Confirm password</label>
                    <input type="password" class="form-input" id="password2" name="password2" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-full" style="justify-content: center;">Create account</button>
            </form>
        </div>
    </div>
    <p class="text-center text-muted mt-2 text-sm">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
{% endblock %}
