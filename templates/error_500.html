<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Something went wrong — Podskrift</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
  /* Standalone page (no base.html): its own minimal copy of the design tokens. */
  :root { --paper: #FFFFFF; --ink: #0E1512; --muted: #56635D; --accent: #0A7A55; --accent-hover: #075C40; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0A0F0D; --ink: #EEF2F0; --muted: #9AA8A1; --accent: #34D399; --accent-hover: #6EE7B7; }
  }
  html { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--paper); color: var(--ink);
         font: 17px/1.55 'Schibsted Grotesk', system-ui, sans-serif; }
  main { width: 100%; max-width: 68ch; padding: 24px; }
  h1 { font-size: clamp(30px, 4vw, 44px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 0 0 16px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent-hover); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Something went wrong on our side</h1>
  <p>Please try again in a minute. Transcriptions run on the server, so a job
     you already started may still finish — check your History.</p>
  <p><a href="/">Back to Podskrift</a> · <a href="/history">History</a></p>
</main>
</body>
</html>
