{% extends "base.html" %}
{% block title %}Transcribing — Podskrift{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 40px auto;">
    <div class="card">
        <div class="card-header">
            <h3>Transcription</h3>
        </div>
        <div class="card-body">
            <div id="statusContainer" class="text-center text-muted" style="padding: 24px 0;">
                Initializing...
            </div>

            <div id="progressContainer" class="hidden">
                <div class="flex-between mb-1">
                    <span id="statusText" class="text-sm">Starting...</span>
                    <span id="progressText" class="text-sm text-muted">0%</span>
                </div>
                <div class="progress-track mb-2">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
                <div id="downloadProgress" class="hidden">
                    <div class="flex-between mb-1">
                        <span class="text-sm text-muted">Download</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="downloadBar" style="width: 0%; background: var(--muted);"></div>
                    </div>
                </div>
            </div>

            <div id="resultContainer" class="hidden">
                <div class="alert alert-success" style="flex-direction: column; align-items: flex-start;">
                    <strong>Transcription complete</strong>
                    <span id="episodeTitle" class="text-sm" style="margin-top: 4px;"></span>
                    <span id="languageInfo" class="text-sm" style="opacity: 0.7;"></span>
                </div>
                <div class="flex-center" style="gap: 8px; justify-content: center;">
                    <button type="button" class="btn btn-primary" id="copyBtn" onclick="copyTranscript()">Copy transcript</button>
                    <a href="#" id="downloadTxt" class="btn btn-ghost">Download .txt</a>
                    <a href="#" id="downloadSrt" class="btn btn-ghost">Download .srt</a>
                </div>
            </div>

            <div id="errorContainer" class="hidden">
                <div class="alert alert-error" style="flex-direction: column; align-items: flex-start;">
                    <strong>Error</strong>
                    <span id="errorMessage" class="text-sm" style="margin-top: 4px;"></span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var taskId = '{{ task_id }}';
var retryCount = 0;
var maxRetries = 5;

function updateStatus() {
    fetch('/status/' + taskId)
        .then(function(r) {
            if (!r.ok && r.status === 401) {
                window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
                return;
            }
            return r.json();
        })
        .then(function(data) {
            if (!data) return;
            retryCount = 0;
            if (data.error && !data.status) { showError(data.error); return; }
            updateUI(data);
            if (data.status !== 'completed' && data.status !== 'error') {
                setTimeout(updateStatus, 2000);
            }
        })
        .catch(function() {
            retryCount++;
            if (retryCount <= maxRetries) {
                setTimeout(updateStatus, 3000 * retryCount);
            } else {
                showError('Lost connection. Refresh to check status.');
            }
        });
}

function updateUI(data) {
    var sc = document.getElementById('statusContainer');
    var pc = document.getElementById('progressContainer');
    var rc = document.getElementById('resultContainer');
    var ec = document.getElementById('errorContainer');

    sc.style.display = 'none';
    pc.style.display = 'none';
    rc.style.display = 'none';
    ec.style.display = 'none';

    if (data.status === 'error') { showError(data.error || 'Unknown error'); return; }
    if (data.status === 'completed') { showResult(data); return; }

    pc.style.display = 'block';
    var msg = data.status === 'downloading' ? 'Downloading audio...'
            : data.status === 'splitting' ? 'Preparing audio...'
            : data.status.indexOf('transcribing') !== -1 ? 'Transcribing...'
            : 'Processing...';
    document.getElementById('statusText').textContent = msg;
    document.getElementById('progressText').textContent = Math.round(data.progress || 0) + '%';
    document.getElementById('progressBar').style.width = (data.progress || 0) + '%';

    if (data.download_progress !== undefined) {
        document.getElementById('downloadProgress').style.display = 'block';
        document.getElementById('downloadBar').style.width = data.download_progress + '%';
    }
}

var transcriptText = '';

function showResult(data) {
    document.getElementById('resultContainer').style.display = 'block';
    document.getElementById('episodeTitle').textContent = data.episode_title || '';
    document.getElementById('languageInfo').textContent = data.language ? 'Language: ' + data.language : '';
    if (data.download_txt) document.getElementById('downloadTxt').href = data.download_txt;
    if (data.download_srt) document.getElementById('downloadSrt').href = data.download_srt;
    if (data.transcript_text) transcriptText = data.transcript_text;
}

function copyTranscript() {
    var btn = document.getElementById('copyBtn');
    navigator.clipboard.writeText(transcriptText).then(function() {
        btn.textContent = 'Copied!';
        setTimeout(function() { btn.textContent = 'Copy transcript'; }, 2000);
    });
}

function showError(msg) {
    document.getElementById('errorContainer').style.display = 'block';
    document.getElementById('errorMessage').textContent = msg;
}

updateStatus();
</script>
{% endblock %}
