{% extends "base.html" %}
{% block title %}Unsubscribe — Podskrift{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 48px auto; text-align: center;">
    <h1 style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 16px;">
        Unsubscribe
    </h1>
    <p style="color: var(--muted); font-size: 15px; line-height: 1.6;">
        Stop receiving emails from Podskrift? This turns off transcript-ready
        mail and new-episode alerts for your account.
    </p>
    <form method="POST" action="{{ url_for('email_unsubscribe', token=token) }}"
          style="margin-top: 24px;">
        <input type="hidden" name="confirm" value="1">
        <button type="submit" class="btn btn-primary">Yes, unsubscribe me</button>
    </form>
    <p style="margin-top: 24px;">
        <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
    </p>
</div>
{% endblock %}
