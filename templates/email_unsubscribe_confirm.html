{% extends "base.html" %}
{% block title %}Unsubscribe — Podskrift{% endblock %}

{% block content %}
<style>
    .unsub-page { max-width: 68ch; margin: 48px auto; }
    .unsub-page h1 {
        font-size: clamp(30px, 4vw, 44px); font-weight: 800; letter-spacing: -0.03em;
        line-height: 1.05; margin-bottom: 16px;
    }
</style>
<div class="unsub-page">
    <h1>
        Unsubscribe
    </h1>
    <p>
        Stop receiving emails from Podskrift? This turns off transcript-ready
        mail and new-episode alerts for your account.
    </p>
    <form method="POST" action="{{ url_for('email_unsubscribe', token=token) }}"
          style="margin-top: 24px;">
        <input type="hidden" name="confirm" value="1">
        <button type="submit" class="btn btn-primary">Yes, unsubscribe me</button>
    </form>
    <p style="margin-top: 24px;">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </p>
</div>
{% endblock %}
