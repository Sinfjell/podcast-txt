{% extends "base.html" %}
{% block title %}Settings — Podskrift{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 24px auto;">
    <h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 24px;">Settings</h2>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" value="{{ current_user.email }}" disabled style="opacity: 0.5;">
                </div>
                <div class="form-group">
                    <label class="form-label" for="openai_api_key">OpenAI API Key</label>
                    <input type="password" class="form-input" id="openai_api_key" name="openai_api_key"
                           value="{{ current_user.openai_api_key or '' }}"
                           placeholder="sk-...">
                    <p class="form-hint">
                        Your key for transcriptions.
                        <a href="https://platform.openai.com/api-keys" target="_blank">Get one here</a>.
                        {% if not current_user.openai_api_key %}
                        <br><span style="color: var(--warning);">No key saved — you'll need to paste one each time.</span>
                        {% endif %}
                    </p>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
